# manufacturer-scraper configuration (no secrets here — the token lives in .env)

hubspot:
  # HubDB table that holds the synced articles. Created automatically by
  # `manufacturer-scraper setup-hubspot` (or adopted if it already exists).
  hubdb_table_name: "manufacturer_news"

scraping:
  # Browser-like UA is required by some sites (Fujifilm).
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/127.0.0.0 Safari/537.36"
  request_delay_s: 1.5      # delay between requests (jitter is added automatically)
  timeout_s: 20
  retries: 3
  max_pages: 3              # default per-run page limit per source; raise for backfills
  db_path: "scraper_state.db"
  # Only import articles published in this year or later, so the first run of
  # a new source does not backfill its entire archive. Use a fixed year
  # (e.g. 2024) to reach further back, or remove this line to import
  # everything. Articles without a published date are always imported.
  min_year: current
  # Keep only print / document-imaging related articles (keyword match on
  # title + categories + summary). On by default so the big diversified
  # vendors (HP, Konica, Canon, Fujifilm) don't flood the feed with laptops,
  # financial results and healthcare news. Specialist print/document sources
  # switch it back off below, since everything they publish is already
  # on-topic and their product names rarely contain the word "print".
  print_topics_only: true

sources:
  fujifilm:
    enabled: true
  canon:
    enabled: true
    per_page: 100
  kyocera:
    enabled: true
    # Only items tagged with at least one of these categories are imported.
    include_categories:
      - "Printers / Multifunctionals"
      - "Printing Devices"
    # Heuristic first-content-image fetch from article pages; fragile, off by default.
    fetch_detail_images: false
    # Already narrowed to printer categories above; don't keyword-filter too.
    print_topics_only: false
  konica:
    enabled: true
  fp:
    enabled: true
    # Specialist franking/mail & print vendor — every release is on-topic.
    print_topics_only: false
  hp:
    enabled: true
    # The HP newsroom covers everything (PCs, 3D printing, corporate, ...).
    # To import only certain categories, list them here (e.g. ["Print", "Printing"]);
    # empty/omitted imports all.
    # include_categories: []
  duplo:
    enabled: true
    per_page: 100
    # Print-finishing vendor; product names ("Spot UV Coater") have no "print".
    print_topics_only: false
  predictive_insight:
    enabled: true
    # Its in-the-press archive is tiny and entirely predates the global
    # min_year cutoff, so disable the filter for this source only.
    min_year: null
    # Managed-print analytics vendor — every item is on-topic.
    print_topics_only: false
  papercut:
    enabled: true
    # Print-management software; titles like "PaperCut Hive" lack print keywords.
    print_topics_only: false
  ijetcolor:
    enabled: true
    # Production inkjet vendor; titles rarely contain the word "print".
    print_topics_only: false
  laserfiche:
    enabled: true
    # Document/content management — adjacent to print, kept in full.
    print_topics_only: false
  docuware:
    enabled: true
    # Document management — adjacent to print, kept in full.
    print_topics_only: false
