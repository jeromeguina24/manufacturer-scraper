name: Daily Manufacturer Scrape

on:
  schedule:
    # Runs at 10:30 AM UTC every day. 
    # NOTE: GitHub Actions Cron runs in UTC. 
    # 5:00 UTC is 12:00AM CST. Adjust as needed!
    - cron: '0 5 * * *'
  
  # This allows you to click a button to run it manually from the GitHub UI
  workflow_dispatch: 

permissions:
  contents: write # Required to allow the workflow to save the DB back to the repo

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Scraper
        run: python -m manufacturer_scraper run
        env:
          # Pulls the token you saved in Step 1
          HUBSPOT_ACCESS_TOKEN: ${{ secrets.HUBSPOT_ACCESS_TOKEN }}
          
      - name: Save State DB back to Repository
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update scraper state [skip ci]"
          file_pattern: "scraper_state.db"
          # The author put this DB in .gitignore, so we must force-add it
          add_options: "-f" 
